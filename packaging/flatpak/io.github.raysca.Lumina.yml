# Flatpak manifest for Lumina, for Flathub (draft).
#
# Build sanity check on a Linux host:
#   flatpak install flathub org.gnome.Sdk//50 org.gnome.Platform//50 \
#       org.freedesktop.Sdk.Extension.rust-stable//25.08
#   flatpak-builder --user --install --force-clean build-dir \
#       packaging/flatpak/io.github.raysca.Lumina.yml
#
# Before a release, bump `commit` to the tagged release, regenerate
# cargo-sources.json with flatpak-cargo-generator.py, and rebuild.
app-id: io.github.raysca.Lumina
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: lumina
separate-locales: false

finish-args:
  # The library is a folder anywhere on the user's disks, and its catalog
  # stores paths relative to that folder. Broad host access is the supported
  # model for a media manager; the portal's per-document paths are not a
  # stable identity for rescans or volume remaps. Removable drives mount under
  # /media or /run/media, so those are listed rather than all of /run.
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
  # GPU rendering (GPUI/Vulkan) and video audio through GStreamer.
  - --device=dri
  - --socket=pulseaudio
  # Native windowing, on Wayland with an X11 fallback.
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11

modules:
  # URL import runs curl for direct video links. The runtime has libcurl but
  # not the CLI, so build a small one against the runtime's GnuTLS.
  - name: curl
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-debug
      - --disable-curldebug
      - --disable-manual
      - --disable-ldap
      - --disable-ldaps
      - --disable-rtsp
      - --disable-dict
      - --disable-telnet
      - --disable-tftp
      - --disable-pop3
      - --disable-imap
      - --disable-smtp
      - --disable-gopher
      - --disable-mqtt
      - --disable-smb
      - --without-libidn2
      - --without-librtmp
      - --without-brotli
      - --without-zstd
      - --without-openssl
      - --with-gnutls
      # The freedesktop runtime keeps its trust store here.
      - --with-ca-bundle=/etc/pki/tls/certs/ca-bundle.crt
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/man
      - /share/aclocal
    post-install:
      - install -Dm644 COPYING /app/share/licenses/io.github.raysca.Lumina/curl-COPYING
    sources:
      - type: archive
        url: https://curl.se/download/curl-8.23.0.tar.xz
        sha256: 8dadd7d2536a314f982ad05a651b713f426bf7d02cc2c76cffb9796f2218e6c5

  # Site pages and HLS playlists use yt-dlp. The project publishes it as a
  # self-contained binary, so the sandbox needs no Python runtime; this is the
  # same release the macOS bundle pins (scripts/fetch_yt_dlp.sh).
  - name: yt-dlp
    buildsystem: simple
    build-commands:
      - install -Dm755 yt-dlp /app/bin/yt-dlp
      - install -Dm644 THIRD_PARTY_LICENSES.txt /app/share/licenses/io.github.raysca.Lumina/yt-dlp-THIRD_PARTY_LICENSES.txt
    sources:
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp_linux
        sha256: 767ba9dce7052aa196f8b12652f433d76de128ba168966fa84b6394d5e6c6795
        dest-filename: yt-dlp
        only-arches: [x86_64]
      - type: file
        url: https://github.com/yt-dlp/yt-dlp/releases/download/2026.10.26/yt-dlp_linux_aarch64
        sha256: e87e9533e89fe5889abaa21f5114dfe7756d6aa6219b83551add04d48b18e483
        dest-filename: yt-dlp
        only-arches: [aarch64]
      - type: file
        url: https://raw.githubusercontent.com/yt-dlp/yt-dlp/2026.10.26/THIRD_PARTY_LICENSES.txt
        sha256: 472aefe951c7db35e1657c1d13fd337140511ed6f2b329205105ad441c5a02b7
        dest-filename: THIRD_PARTY_LICENSES.txt

  # The app runs ffmpeg for video posters, scrub previews and URL-import
  # merging. The runtime does not carry the CLI, so build the same minimal,
  # LGPL-only, network-free binary the macOS bundle uses.
  - name: ffmpeg
    buildsystem: autotools
    config-opts:
      - --disable-everything
      - --disable-autodetect
      - --disable-network
      - --disable-doc
      - --disable-debug
      - --disable-ffplay
      - --disable-ffprobe
      - --disable-x86asm
      - --disable-shared
      - --enable-static
      - --enable-zlib
      - --enable-protocol=file,pipe
      - --enable-demuxer=mov,matroska,mpegts,aac,mp3,h264,hevc
      - --enable-muxer=mp4,mov,ipod
      - --enable-parser=h264,hevc,aac,av1,vp9,opus,mpegaudio,ac3
      - --enable-decoder=aac,h264,hevc,vp9
      - --enable-bsf=aac_adtstoasc,extract_extradata,vp9_superframe,null
    cleanup:
      - /include
      - /lib/*.a
      - /lib/pkgconfig
      - /share/man
    post-install:
      - install -Dm644 COPYING.LGPLv2.1 /app/share/licenses/io.github.raysca.Lumina/ffmpeg-COPYING.LGPLv2.1
    sources:
      - type: archive
        url: https://ffmpeg.org/releases/ffmpeg-9.0.2.tar.xz
        sha256: 8c3850283eb25fa026482078a04051e0be17347b09ef81a0849bec15a96e002e

  - name: lumina
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      env:
        CARGO_HOME: /run/build/lumina/cargo
    build-commands:
      - cargo build --release --offline --locked -p lumina-ui-gpui --bin Lumina
      - install -Dm755 target/release/Lumina /app/bin/lumina
      - install -Dm644 resources/linux/io.github.raysca.Lumina.desktop /app/share/applications/io.github.raysca.Lumina.desktop
      - install -Dm644 resources/linux/io.github.raysca.Lumina.metainfo.xml /app/share/metainfo/io.github.raysca.Lumina.metainfo.xml
      - install -Dm644 resources/app_icon.png /app/share/icons/hicolor/512x512/apps/io.github.raysca.Lumina.png
      # Flathub expects the licence and the bundled assets' licences inside the app.
      - install -Dm644 LICENSE /app/share/licenses/io.github.raysca.Lumina/LICENSE
      - install -Dm644 resources/fonts/Inter-LICENSE.txt /app/share/licenses/io.github.raysca.Lumina/Inter-LICENSE.txt
      - install -Dm644 resources/fonts/InterTight-OFL.txt /app/share/licenses/io.github.raysca.Lumina/InterTight-OFL.txt
      - install -Dm644 resources/fonts/JetBrainsMono-OFL.txt /app/share/licenses/io.github.raysca.Lumina/JetBrainsMono-OFL.txt
      - install -Dm644 resources/icons/LICENSE /app/share/licenses/io.github.raysca.Lumina/icons-LICENSE.txt
    sources:
      # Flathub wants a tagged release; until the first Linux release tag
      # exists this pins the last commit that has the whole app tree.
      - type: git
        url: https://github.com/raysca/lumina.git
        commit: 82dac8162362fa4e6f34ba03f2b3f45dd85e54da
      - cargo-sources.json
