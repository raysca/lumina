name: Website

# Builds the static site in site/ (plus fonts and brand art copied from
# resources/) and publishes it to GitHub Pages. The site has no build tools,
# trackers or third-party requests.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - resources/brand/**
      - resources/fonts/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: ./site/build.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
