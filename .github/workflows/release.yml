name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: build, sign and package
    runs-on: macos-14
    permissions:
      contents: write
    env:
      # `secrets` is not available in `if:`; expose whether it is set.
      HAS_SIGNING_CERT: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      LUMINA_NOTARIZE: ${{ (secrets.LUMINA_NOTARY_PROFILE != '' || secrets.APPLE_ID != '') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (universal targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$APPLE_CERTIFICATE_P12" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$(security list-keychains -d user | tr -d '"')"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build, sign and package
        env:
          LUMINA_UNIVERSAL: "1"
          LUMINA_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          LUMINA_NOTARY_PROFILE: ${{ secrets.LUMINA_NOTARY_PROFILE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "${LUMINA_SIGN_IDENTITY:-}" ]; then
            echo "No signing identity configured; producing ad-hoc build"
            export LUMINA_SIGN_IDENTITY="-"
          fi
          ./scripts/package_release.sh

      - name: Warn about an unsigned draft
        if: success() && env.HAS_SIGNING_CERT != 'true'
        run: |
          echo "::warning::This draft is ad-hoc signed and is not distributable. Configure the Developer ID secrets before publishing."

      - name: Warn about a signed-only draft
        if: success() && env.HAS_SIGNING_CERT == 'true' && env.LUMINA_NOTARIZE != '1'
        run: |
          echo "::warning::This draft is Developer ID signed but not notarized. Gatekeeper blocks the first launch and the in-app updater refuses it: add the System Settings > Privacy & Security > Open Anyway steps to the release notes, and expect manual updates until a notarized release ships."

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lumina-release
          path: |
            target/release/bundle/osx/*.zip
            target/release/bundle/osx/*.dmg
            target/release/bundle/osx/SHA256SUMS.txt

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            target/release/bundle/osx/*.zip
            target/release/bundle/osx/*.dmg
            target/release/bundle/osx/SHA256SUMS.txt

  # The Linux package joins the same draft release only when a release key is
  # configured: a draft must never carry an unsigned Linux artifact
  # (RELEASING.md). Without the key the build still runs and its files stay a
  # short-lived workflow artifact.
  linux:
    name: build, check and sign Linux package (amd64)
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      LINUX_SIGNING_KEY: ${{ secrets.LINUX_SIGNING_KEY }}
      # `secrets` is not available in `if:`; expose whether both are set.
      HAS_LINUX_SIGNING_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY != '' && secrets.LINUX_SIGNING_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build and media dependencies
        run: ./scripts/install_linux_deps.sh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-release

      - name: Import the Linux release key
        if: env.HAS_LINUX_SIGNING_KEY == 'true'
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          gpg --batch --list-secret-keys "$LINUX_SIGNING_KEY" >/dev/null
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: Build package
        run: ./scripts/package_linux.sh

      - name: Install, launch and remove package
        run: ./scripts/check_linux_package.sh

      # The release name carries the version, and the checksums cover exactly
      # what is published. They are separate from the macOS SHA256SUMS.txt the
      # in-app updater reads.
      - name: Assemble release files
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/lumina-ui-gpui/Cargo.toml | head -1)"
          ARCH="$(dpkg --print-architecture)"
          OUT="target/release/bundle/linux"
          DIST="target/release/bundle/linux-dist"
          NAME="Lumina-v${VERSION}-linux-${ARCH}.deb"
          rm -rf "$DIST"
          mkdir -p "$DIST"
          cp "$OUT/lumina_${VERSION}_${ARCH}.deb" "$DIST/$NAME"
          (cd "$DIST" && sha256sum "$NAME" > SHA256SUMS-linux.txt)

      - name: Sign the checksums
        if: env.HAS_LINUX_SIGNING_KEY == 'true'
        env:
          LINUX_SIGNING_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
        run: ./scripts/sign_linux_release.sh target/release/bundle/linux-dist

      - name: Upload Linux package artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumina-linux-amd64
          path: target/release/bundle/linux-dist/*
          retention-days: 30

      - name: Attach to the draft release
        if: env.HAS_LINUX_SIGNING_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: target/release/bundle/linux-dist/*
