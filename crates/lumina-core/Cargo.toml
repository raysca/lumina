[package]
name = "lumina-core"
version = "0.2.0"
edition = "2021"
license = "MIT"

[dependencies]
crossbeam-channel = "0.5"
rayon = "1.10"
parking_lot = "0.12"

walkdir = "2.5"

kamadak-exif = "0.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
dirs = "5.0"

image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
zune-jpeg = "0.4"

notify-debouncer-mini = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
trash = "5.2"

[build-dependencies]
cc = "1.0"

[features]
# Hooks for dependents' tests (see `Catalog::with_lock_held`).
test-support = []
