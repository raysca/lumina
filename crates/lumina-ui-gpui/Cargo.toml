[package]
name = "lumina-ui-gpui"
version = "0.2.0"
edition = "2021"
# gpui-pre (through gpui-kit) uses std::hint::cold_path, stable since 1.95.
rust-version = "1.95"
default-run = "Lumina"
license = "MIT"

[[bin]]
name = "Lumina"
path = "src/main.rs"

# Real AVFoundation playback: it needs the main run loop, which libtest's
# harness never runs, so this test drives it from its own main().
[[test]]
name = "frame_pump"
harness = false

[features]
linux-ui-smoke = []

[dependencies]
lumina-core = { path = "../lumina-core" }
# GPUI comes through GPUI Kit, which pins the matching gpui-pre snapshot.
# Renamed so `use gpui::*` stays the import everywhere. The text fields use
# gpui-base's unstyled Input, which is always built; the default features
# (gpui-component widgets, bundled icon assets) stay off until one is used.
gpui = { package = "gpui-kit", version = "0.9.0", default-features = false }
rfd = "0.15"
parking_lot = "0.12"
lru = "0.12"
anyhow = "1.0"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-channel = "2.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
smallvec = "1.14"

# Already built by gpui (same version, so no new crate): the PiP window's
# NSView, to keep it visible while Lumina is inactive (player/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
raw-window-handle = "0.6"
# The video surface GPUI paints (player/macos.rs). Already built by gpui
# (same versions and features, so no new crate).
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["CVBuffer", "CVImageBuffer", "CVPixelBuffer"] }

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.25.4"
gstreamer-app = "0.25.2"
gstreamer-video = "0.25.4"

[target.'cfg(target_os = "macos")'.build-dependencies]
cc = "1.0"

[dev-dependencies]
gpui = { package = "gpui-kit", version = "0.9.0", default-features = false, features = ["test-support"] }
lumina-core = { path = "../lumina-core", features = ["test-support"] }
# Already built by gpui (same pinned version, so no new crate): TestApp
# configures its TestScheduler (see tests/mod.rs).
scheduler = { package = "gpui-pre-scheduler", version = "=0.3.11" }
# Builds catalogs in an old layout for upgrade tests; same spec as lumina-core.
rusqlite = { version = "0.31", features = ["bundled"] }


