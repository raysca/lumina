[package]
name = "lumina-ui-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
lumina-core = { path = "../lumina-core" }
gpui = "0.2.2"
rfd = "0.15"
parking_lot = "0.12"
lru = "0.12"
anyhow = "1.0"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
async-channel = "2.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
smallvec = "1.14"
