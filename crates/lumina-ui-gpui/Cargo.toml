[package]
name = "lumina-ui-gpui"
version = "0.2.0"
edition = "2021"
license = "MIT"

[[bin]]
name = "lumina-ui-gpui"
path = "src/main.rs"

[[bin]]
name = "generate-icon"
path = "src/bin/generate_icon.rs"
required-features = ["generate-icon"]

[features]
generate-icon = []

[dependencies]
lumina-core = { path = "../lumina-core" }
gpui = "0.2.2"
rfd = "0.15"
parking_lot = "0.12"
lru = "0.12"
anyhow = "1.0"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-channel = "2.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
smallvec = "1.14"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
# Builds catalogs in an old layout for upgrade tests; same spec as lumina-core.
rusqlite = { version = "0.31", features = ["bundled"] }


